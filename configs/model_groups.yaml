# Canonical scale targets: 4 scales x 3 families (DETAILS.md §5, experiments.md §2).
# The Transformer is the reference total at each scale. count_params.py solves the free knob of gdlm/wang
# (`solve:`) for the closest total-parameter match (tolerance below), instantiates every model on the meta
# device, and freezes the result to configs/frozen/<scale>_<family>.json with a config_sha256.
tolerance: 0.02            # |total - reference| / reference
seq_len: 2048

scales:
  50M:
    tokenizer: llama2
    vocab: 32000
    data_seed: 1234        # training-window order; identical for all families and seeds of the scale
    transformer: {d: 512, n_layers: 12, n_heads: 8, n_kv_heads: 8, head_dim: 64, ffn: 1152, rope_theta: 10000.0}
    # GD layers/heads follow the generator (one GD layer per generator layer, d/64 heads of 64);
    # the generator FFN width absorbs the GD parameters.
    gdlm: {solve: ffn, ffn_multiple: 64}
    # no generator; d/64 heads of 64 per GD layer, positional covariate width = d; depth absorbs the budget.
    wang: {solve: gd_layers, cov_dim: 512}
  100M:
    tokenizer: llama2
    vocab: 32000
    data_seed: 1234
    transformer: {d: 768, n_layers: 12, n_heads: 12, n_kv_heads: 12, head_dim: 64, ffn: 1792, rope_theta: 10000.0}
    gdlm: {solve: ffn, ffn_multiple: 64}
    wang: {solve: gd_layers, cov_dim: 768}
  400M:
    tokenizer: llama2
    vocab: 32000
    data_seed: 1234
    transformer: {d: 1024, n_layers: 24, n_heads: 16, n_kv_heads: 16, head_dim: 64, ffn: 3584, rope_theta: 10000.0}
    gdlm: {solve: ffn, ffn_multiple: 64}
    wang: {solve: gd_layers, cov_dim: 1024}
  1.2B:                    # build/verify only (meta device). Not trained or evaluated (DETAILS.md §1).
    tokenizer: llama3
    vocab: 128256
    data_seed: 1234
    # official Llama-3.2-1B config.json: 16 layers, hidden 2048, 32 Q / 8 KV heads, head dim 64,
    # intermediate 8192, rope_theta 500000 with llama3 scaling, rms_norm_eps 1e-5, tied embeddings
    transformer:
      d: 2048
      n_layers: 16
      n_heads: 32
      n_kv_heads: 8
      head_dim: 64
      ffn: 8192
      rope_theta: 500000.0
      rope_scaling: {factor: 32.0, low_freq_factor: 1.0, high_freq_factor: 4.0, original_max_position_embeddings: 8192}
    # generator keeps the Llama-3.2 GQA attention; GD kernels are 32 independent tied-QK heads per layer
    # (GQA in the generator does not imply GQA in the GD kernels).
    gdlm: {solve: ffn, ffn_multiple: 64}
    wang: {solve: gd_layers, cov_dim: 2048}
